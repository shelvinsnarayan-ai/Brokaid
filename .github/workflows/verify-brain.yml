name: verify-brain
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/verify-brain.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/verify-brain.yml"

jobs:
  brain-suite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brokaid
          POSTGRES_PASSWORD: brokaid_dev_local
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brokaid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install fastapi uvicorn asyncpg python-dotenv pydantic rfc8785 pytest pytest-asyncio hypothesis
      - name: Run phase-3 suite (contracts + brain + job_runner)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://brokaid:brokaid_dev_local@localhost:5432/postgres
        run: |
          python -m pytest tests/test_contracts.py tests/test_brain.py tests/test_job_runner.py -v
