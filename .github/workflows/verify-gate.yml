name: Verify gate invariants

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  invariants:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: brokaid
          POSTGRES_PASSWORD: brokaid_dev_local
          POSTGRES_DB: brokaid
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U brokaid"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://brokaid:brokaid_dev_local@localhost:5432/brokaid

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install fastapi 'uvicorn[standard]' asyncpg pydantic python-dotenv rfc8785 pytest pytest-asyncio httpx hypothesis

      - name: Grant CREATEDB to brokaid (test fixture)
        run: |
          PGPASSWORD=brokaid_dev_local psql -U brokaid -h localhost -d brokaid -c "SELECT current_user;"
          PGPASSWORD=brokaid_dev_local psql -U postgres -h localhost -c "ALTER ROLE brokaid CREATEDB;" 2>/dev/null || true

      - name: Apply migrations
        working-directory: backend
        run: python -m app.migrate

      - name: Gate invariant suite (property-based)
        working-directory: backend
        run: pytest -v tests/test_gate_invariants.py tests/test_coverage_guard.py

      - name: Unlock protocol
        working-directory: backend
        run: pytest -v tests/test_unlock.py

      - name: Restart safety (SIGKILL + resume)
        working-directory: backend
        run: pytest -v tests/test_restart_safety.py

      - name: Trail suite (regression)
        working-directory: backend
        run: pytest -v tests/test_trail.py
