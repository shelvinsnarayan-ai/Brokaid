name: verify-migration-durability

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  restore-and-migrate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: brokaid
          POSTGRES_PASSWORD: brokaid
          POSTGRES_DB: brokaid
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brokaid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://brokaid:brokaid@localhost:5432/brokaid
      MONGO_URL:    mongodb://placeholder/unused
      DB_NAME:      brokaid
      EMERGENT_LLM_KEY: ${{ secrets.EMERGENT_LLM_KEY }}
      AUTH_DEV_MODE: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -U pip
          pip install -r backend/requirements.txt

      - name: Restore phase-11 snapshot
        run: |
          gunzip -c infra/postgres/snapshots/phase11.sql.gz \
            | psql "$DATABASE_URL"

      - name: Run migrations (must apply 011 + any newer idempotently)
        run: python -m app.migrate
        working-directory: backend

      - name: Boot API in background
        run: |
          cd backend
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8001 \
            > /tmp/api.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8001/api/healthz > /dev/null; then
              echo "API up"; exit 0
            fi
            sleep 1
          done
          echo "API failed to start"; cat /tmp/api.log; exit 1

      - name: Public verifier smoke test (asserts 4xx, fails on 5xx)
        run: |
          # The public verifier expects the RAW token; the snapshot only
          # exposes hashes. Until Phase16Blocker lands, we hit with a
          # random token and *require* an explicit 4xx (401/403/404).
          # Any 5xx is a durability failure — the route is broken.
          RANDOM_TOKEN="unknown-$(date +%s)-$RANDOM"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "http://127.0.0.1:8001/api/verifier/${RANDOM_TOKEN}")
          echo "verifier smoke status: ${STATUS}"
          case "${STATUS}" in
            401|403|404)
              echo "OK — got expected 4xx for unknown token"
              ;;
            5*)
              echo "FAIL — verifier returned ${STATUS} (5xx = durability break)"
              exit 1
              ;;
            2*)
              echo "FAIL — verifier returned ${STATUS} but no seeded raw token was provided"
              exit 1
              ;;
            *)
              echo "FAIL — verifier returned unexpected status ${STATUS}"
              exit 1
              ;;
          esac

      - name: Operator queue smoke test (dev-mode session)
        run: |
          COOKIE=$(curl -s -c - -X POST http://127.0.0.1:8001/api/auth/dev/impersonate \
             -H "Content-Type: application/json" \
             -d '{"email":"principal@burmac.example"}' \
             | grep brokaid_session | awk '{print $NF}')
          curl -sf "http://127.0.0.1:8001/api/o/queue" \
            -H "Cookie: brokaid_session=$COOKIE" \
            | python3 -c "import sys, json; d=json.load(sys.stdin); print('queue rows:', len(d.get('rows', d if isinstance(d, list) else [])))"

      - name: Fail loudly if any step exit code was non-zero
        if: failure()
        run: cat /tmp/api.log || true
